# Netlify config for Premier Barber & Beauty (static site, no build step).
# Deploy: connect the GitHub repo in Netlify, leave "Build command" empty, "Publish directory" = "."

[build]
  publish = "."
  # Regenerate HTML with Netlify's URL in og:image / og:url so text-message previews work.
  command = "pip install -r requirements.txt && python _build/build.py"

# Clean URLs: /team -> team.html, /team/maal -> team/maal.html (Netlify serves .html automatically).
# Old Squarespace paths → new pages
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
[[redirects]]
  from = "/book-now"
  to = "/book"
  status = 301
[[redirects]]
  from = "/barbers"
  to = "/team"
  status = 301
[[redirects]]
  from = "/stylists"
  to = "/team"
  status = 301
[[redirects]]
  from = "/prices"
  to = "/services"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# keep the generator source private
[[redirects]]
  from = "/_build/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
